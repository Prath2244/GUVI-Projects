<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="static/logo.png" height="40" alt="GUVI Logo" class="d-inline-block align-text-top me-2">
                Registration Form
            </a>
        </div>
    </nav>

    <div class="container m-4 mx-auto">
        <div id="showMessage"></div> <div class="row gap-4 justify-content-center">
            <div class="col-md-5 bg-white p-4 shadow rounded">
                <h5 class="text-center bg-success text-white p-2 rounded">Register Your Details</h5>
                
                <form id="registrationForm">
                    <div class="form-group mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" id="name" placeholder="Enter your name">
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Enter a secure password">
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="Aadhar" class="form-label">Aadhar Number</label>
                        <input type="number" class="form-control" name="AadharNumber" id="Aadhar" placeholder="12-digit Aadhar number">
                    </div>
                    
                    <div class="form-group mb-4">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="type" id="male" value="Male" checked>
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="type" id="female" value="Female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </form>
            </div>

            <div class="col-md-6 bg-white p-4 shadow rounded">
                <form class="d-flex mb-3" id="searchForm">
                    <input class="form-control me-2" type="search" id="searchInput" placeholder="Search users..." aria-label="Search">
                </form>

                <h5 class="text-center bg-light text-dark p-2 border rounded">View Details</h5>
                <div class="table-responsive">
                    <table class="table table-success table-striped mt-3">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Aadhar</th>
                                <th scope="col">Gender</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
